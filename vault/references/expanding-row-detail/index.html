<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expanding row detail</title>
<style>
  :root {
    --bg: #f6f6f3;
    --ink: #0d1117;
    --muted: #5c636e;
    --rule: #d6d8db;
    --accent: #1f43c8;
    --tint: #ecece7;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --expand-duration: 440ms;
    --collapse-duration: 330ms;
    --row-ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: clamp(40px, 7vw, 96px) clamp(20px, 4vw, 48px) 96px; }

  .head { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 48px; align-items: end; margin-bottom: clamp(32px, 5vw, 64px); }
  .eyebrow { font: 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
  .head h1 { margin: 0; font-size: clamp(34px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.035em; font-weight: 600; }
  .head > p { margin: 0; color: var(--muted); max-width: 42ch; justify-self: end; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row, .rows-end, .after { position: relative; background: var(--bg); }
  .row { border-top: 1px solid var(--rule); }
  .rows-end { border-top: 1px solid var(--rule); height: 0; }
  .row h2 { margin: 0; font: inherit; }
  .row-btn {
    position: relative; width: 100%; appearance: none; border: 0; background: none; color: inherit; cursor: pointer; text-align: left;
    display: grid; grid-template-columns: 64px 1fr auto 44px; align-items: center; gap: 16px;
    padding: 26px 0; font: inherit; isolation: isolate;
  }
  .row-btn::before {
    content: ""; position: absolute; inset: 0 -16px; background: var(--tint); opacity: 0;
    transition: opacity 160ms var(--ease-out); z-index: -1;
  }
  .idx { font: 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { font-size: clamp(22px, 3vw, 38px); font-weight: 500; letter-spacing: -0.025em; line-height: 1.1; transition: transform 200ms var(--ease-out); }
  .tag { color: var(--muted); font-size: 14px; }
  .icon { position: relative; width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 50%; }
  .icon::before, .icon::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 1.5px; margin: -0.75px 0 0 -7px; background: var(--ink); transition: transform 240ms var(--ease-out); }
  .icon::after { transform: rotate(90deg); }
  .row-btn[aria-expanded="true"] .icon::before { transform: rotate(45deg); }
  .row-btn[aria-expanded="true"] .icon::after { transform: rotate(135deg); }
  .row-btn[aria-expanded="true"] .icon { background: var(--ink); border-color: var(--ink); }
  .row-btn[aria-expanded="true"] .icon::before, .row-btn[aria-expanded="true"] .icon::after { background: var(--bg); }
  @media (hover: hover) {
    .row-btn:hover::before { opacity: 1; }
    .row-btn:hover .name { transform: translateX(8px); }
  }
  .row-btn:focus-visible { outline: none; }
  .row-btn:focus-visible::before { opacity: 1; outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-btn:focus-visible .name { transform: translateX(8px); }

  .panel { position: relative; }
  .panel.is-collapsing { position: absolute; left: 0; right: 0; z-index: 0; }
  .panel-inner {
    display: grid; grid-template-columns: 64px 1.3fr 1fr; gap: 24px 16px; padding: 4px 0 40px;
  }
  .panel-copy { grid-column: 2; max-width: 48ch; }
  .panel-copy p { margin: 0 0 18px; font-size: 17px; line-height: 1.5; color: #262b33; }
  .stats { grid-column: 3; list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .stats li { display: grid; grid-template-columns: 120px 1fr; align-items: baseline; gap: 12px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .stats b { font-size: 28px; font-weight: 500; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: 13px; }
  .more { display: inline-flex; gap: 10px; align-items: center; color: var(--accent); text-decoration: none; font-weight: 500; }
  .more svg { transition: transform 200ms var(--ease-out); }
  .more:hover svg, .more:focus-visible svg { transform: translateX(4px); }
  .more:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .after { display: flex; justify-content: space-between; gap: 24px; padding-top: 28px; color: var(--muted); font-size: 14px; }
  .after a { color: var(--ink); }

  @media (max-width: 720px) {
    .head { grid-template-columns: 1fr; }
    .head > p { justify-self: start; }
    .row-btn { grid-template-columns: 36px 1fr 40px; padding: 22px 0; }
    .tag { display: none; }
    .icon { width: 40px; height: 40px; }
    .panel-inner { grid-template-columns: 36px 1fr; }
    .panel-copy, .stats { grid-column: 2; }
    .after { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    .name, .icon::before, .icon::after, .more svg { transition: none; }
    .row-btn:hover .name, .row-btn:focus-visible .name, .more:hover svg, .more:focus-visible svg { transform: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow">Arden Vale &amp; Co. / Services</p>
      <h1>Where we advise</h1>
    </div>
    <p>Five practices, one partnership. Open a practice to see its scope and last year's numbers.</p>
  </header>

  <ol class="rows" id="rows"></ol>
  <div class="rows-end" aria-hidden="true"></div>
  <div class="after">
    <span>Figures cover the twelve months to 30 September 2026.</span>
    <a href="#contact">Speak to a partner</a>
  </div>
</main>

<script>
const css = getComputedStyle(document.documentElement);
const EXPAND_MS = parseFloat(css.getPropertyValue('--expand-duration')) || 440;
const COLLAPSE_MS = parseFloat(css.getPropertyValue('--collapse-duration')) || 330;
const ROW_EASE = css.getPropertyValue('--row-ease').trim() || 'cubic-bezier(0.32, 0.72, 0, 1)';

const SERVICES = [
  { name: 'Capital markets', tag: 'Equity, debt and hybrid issuance', copy: 'We prepare issuers for public and private raises, from the first ratings conversation to allocation day. Most of our mandates are second or third issues for mid-cap industrials.', stats: [['$4.2bn', 'raised for clients'], ['31', 'transactions closed'], ['9', 'first-time issuers']] },
  { name: 'Mergers and acquisitions', tag: 'Buy side and sell side', copy: 'Founder-led and family businesses selling for the first time make up two thirds of our sell-side work. On the buy side we run carve-outs where the target has never reported on its own.', stats: [['$2.7bn', 'aggregate deal value'], ['18', 'deals signed'], ['63%', 'cross-border']] },
  { name: 'Restructuring', tag: 'Boards, lenders and creditors', copy: 'We act for boards and lender groups when liquidity runs short. The work starts with a thirteen-week cash forecast that every party agrees to use.', stats: [['14', 'mandates'], ['$1.9bn', 'debt reprofiled'], ['0', 'formal insolvencies']] },
  { name: 'Risk and regulation', tag: 'Capital, liquidity, model risk', copy: 'We help banks and insurers answer supervisors with evidence: capital models that can be rerun, liquidity stress tests with named assumptions, and remediation plans with owners and dates.', stats: [['22', 'regulated clients'], ['6', 'jurisdictions'], ['40', 'models validated']] },
  { name: 'Private capital', tag: 'Fund formation and secondaries', copy: 'We structure first and second funds for managers raising under $800m, and run continuation vehicles when a manager wants to hold a strong asset longer.', stats: [['$1.1bn', 'committed capital'], ['7', 'funds closed'], ['3', 'continuation vehicles']] },
];

const list = document.getElementById('rows');
list.innerHTML = SERVICES.map((s, i) => `
  <li class="row">
    <h2><button class="row-btn" id="b${i}" type="button" aria-expanded="false" aria-controls="p${i}">
      <span class="idx">${String(i + 1).padStart(2, '0')}</span>
      <span class="name">${s.name}</span>
      <span class="tag">${s.tag}</span>
      <span class="icon" aria-hidden="true"></span>
    </button></h2>
    <div class="panel" id="p${i}" role="region" aria-labelledby="b${i}" hidden>
      <div class="panel-inner">
        <div class="panel-copy">
          <p>${s.copy}</p>
          <a class="more" href="#case-${i}">Read a recent case <svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><path d="M11 1l4 4-4 4M15 5H0" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a>
        </div>
        <ul class="stats">${s.stats.map(([n, l]) => `<li><b>${n}</b><span>${l}</span></li>`).join('')}</ul>
      </div>
    </div>
  </li>`).join('');

const rows = [...list.children];
const flipTargets = [...rows, document.querySelector('.rows-end'), document.querySelector('.after')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const running = new Set();
let openRow = null;

const panelOf = (row) => row.querySelector('.panel');
const btnOf = (row) => row.querySelector('.row-btn');

// Visible height of a panel mid-animation, read from its computed clip-path so a reversal starts where the eye is.
function visibleHeight(panel) {
  if (panel.hidden) return 0;
  const h = panel.offsetHeight;
  const m = getComputedStyle(panel).clipPath.match(/inset\(([^)]*)\)/);
  if (!m) return h;
  const v = m[1].trim().split(/\s+/).map(parseFloat);
  const bottom = v.length < 3 ? v[0] : v[2];
  return Math.max(0, h - bottom);
}

function play(el, keyframes, duration, delay = 0) {
  const a = el.animate(keyframes, { duration, delay, easing: ROW_EASE, fill: 'backwards' });
  running.add(a);
  a.finished.then(() => running.delete(a), () => running.delete(a));
  return a;
}

function toggle(row) {
  const closing = openRow;
  const opening = openRow === row ? null : row;

  const first = new Map(flipTargets.map(el => [el, el.getBoundingClientRect().top]));
  const visibleClosing = closing ? visibleHeight(panelOf(closing)) : 0;
  const visibleOpening = opening ? visibleHeight(panelOf(opening)) : 0;
  running.forEach(a => a.cancel());
  running.clear();
  rows.forEach(r => { const p = panelOf(r); if (r !== opening && r !== closing) { p.hidden = true; p.classList.remove('is-collapsing'); } });

  if (closing) {
    const p = panelOf(closing);
    btnOf(closing).setAttribute('aria-expanded', 'false');
    p.classList.add('is-collapsing');
    p.inert = true;
  }
  if (opening) {
    const p = panelOf(opening);
    btnOf(opening).setAttribute('aria-expanded', 'true');
    p.hidden = false;
    p.inert = false;
    p.classList.remove('is-collapsing');
  }
  openRow = opening;

  if (reduce.matches) {
    if (closing) { panelOf(closing).hidden = true; panelOf(closing).classList.remove('is-collapsing'); }
    if (opening) panelOf(opening).querySelector('.panel-inner').animate({ opacity: [0, 1] }, { duration: 160, easing: 'ease-out' });
    return;
  }

  const duration = opening ? EXPAND_MS : COLLAPSE_MS;
  flipTargets.forEach(el => {
    const dy = first.get(el) - el.getBoundingClientRect().top;
    if (Math.abs(dy) > 0.5) play(el, [{ transform: `translateY(${dy}px)` }, { transform: 'none' }], duration);
  });

  if (opening) {
    const p = panelOf(opening);
    const h = p.offsetHeight;
    play(p, [{ clipPath: `inset(0 0 ${h - visibleOpening}px 0)` }, { clipPath: 'inset(0 0 0px 0)' }], duration);
    if (visibleOpening === 0) play(p.querySelector('.panel-inner'), [{ opacity: 0, transform: 'translateY(-12px)' }, { opacity: 1, transform: 'none' }], duration, 40);
  }
  if (closing) {
    const p = panelOf(closing);
    const h = p.offsetHeight;
    const a = play(p, [{ clipPath: `inset(0 0 ${h - visibleClosing}px 0)` }, { clipPath: `inset(0 0 ${h}px 0)` }], duration);
    a.effect.updateTiming({ fill: 'both' });
    a.finished.then(() => { p.hidden = true; p.classList.remove('is-collapsing'); a.cancel(); }, () => {});
  }
}

list.addEventListener('click', (e) => {
  const btn = e.target.closest('.row-btn');
  if (btn) toggle(btn.closest('.row'));
});

addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !openRow) return;
  const btn = btnOf(openRow);
  toggle(openRow);
  btn.focus();
});
</script>
</body>
</html>
