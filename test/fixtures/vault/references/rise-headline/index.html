<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rise Headline</title>
<style>
:root {
  --rise-duration: 600ms;
  --rise-stagger: 60ms;
}
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #101820;
  color: #f2efe6;
}
section {
  min-height: 100vh;
  display: grid;
  align-content: center;
  padding: 0 8vw;
}
.line {
  overflow: hidden;
}
.line span {
  display: block;
  transform: translateY(100%);
  transition: transform var(--rise-duration) cubic-bezier(0.22, 1, 0.36, 1);
  transition-delay: calc(var(--index) * var(--rise-stagger));
}
.in .line span {
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .line span { transform: none; transition: none; }
}
</style>
</head>
<body>
<section id="intro">
  <h1>
    <span class="line"><span style="--index:0">Stories rise</span></span>
    <span class="line"><span style="--index:1">from the page</span></span>
  </h1>
</section>
<script>
const section = document.getElementById("intro");
new IntersectionObserver((entries) => {
  for (const entry of entries) section.classList.toggle("in", entry.isIntersecting);
}, { threshold: 0.4 }).observe(section);
</script>
</body>
</html>
