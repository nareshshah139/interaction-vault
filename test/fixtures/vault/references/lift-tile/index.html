<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift Tile</title>
<style>
:root {
  --lift: 6px;
  --lift-duration: 180ms;
}
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: system-ui, sans-serif;
  background: #f4f1ec;
}
.tile {
  display: block;
  width: min(80vw, 320px);
  padding: 2rem;
  border: 1px solid #1d1d1b;
  background: linear-gradient(160deg, #fff, #e8e2d8);
  color: #1d1d1b;
  text-decoration: none;
  transition: transform var(--lift-duration) cubic-bezier(0.22, 1, 0.36, 1);
}
.tile:hover,
.tile:focus-visible {
  transform: translateY(calc(var(--lift) * -1));
}
@media (prefers-reduced-motion: reduce) {
  .tile { transition: none; }
  .tile:hover,
  .tile:focus-visible { transform: none; }
}
</style>
</head>
<body>
<a class="tile" href="#tile">
  <h1>Lift Tile</h1>
  <p>Hover or focus the tile.</p>
</a>
</body>
</html>
